# Publica uma Release (instaladores + latest.json para o updater) a partir do main:
# sobe a versão nos três ficheiros, faz push e depois `gh workflow run release.yml`.
# O próprio workflow cria a tag `v<versão>`.
#
# Porquê do main e não de um push de tag: o GitHub só deixa uma tag reaproveitar a
# cache dela própria ou a do main. Com o gatilho na tag, cada release guardava ~1,5 GB
# de compilação que nenhuma outra conseguia ler e compilava tudo do zero (~9 min no
# Windows, ~18 no macOS). Do main, cada release parte da cache da anterior.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

# Duas releases ao mesmo tempo disputariam a mesma tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Confirma que a versão bate certo nos três ficheiros e que ainda não foi publicada, e
  # cria a tag. Um push de tag com o GITHUB_TOKEN não dispara outros workflows.
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar a versão e criar a tag
        id: version
        shell: bash
        run: |
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          tauri_v=$(grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          npm_v=$(grep -m1 '"version"' package.json | cut -d'"' -f4)
          echo "cargo=$cargo_v tauri=$tauri_v package=$npm_v"
          if [ "$cargo_v" != "$tauri_v" ] || [ "$cargo_v" != "$npm_v" ]; then
            echo "::error::As versões não coincidem: Cargo.toml ($cargo_v), tauri.conf.json ($tauri_v), package.json ($npm_v)."
            exit 1
          fi
          tag="v$cargo_v"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::A tag $tag já existe: sobe a versão antes de publicar."
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # No macOS compila-se um binário universal (arm64 e x86_64).
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Fica no âmbito do main (ver o topo): a release seguinte só recompila o Ditok.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # O macOS guarda a permissão do microfone associada à identidade de assinatura.
      # Assinar sempre com o mesmo certificado (autoassinado, ver ~/.tauri) faz com
      # que a permissão sobreviva às atualizações.
      - name: Importar certificado de assinatura (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ditok.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Autoassinado = não confiável por omissão; marcamo-lo como confiável para assinar código.
          security find-certificate -c "Ditok Self-Signed" -p "$KEYCHAIN" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && 'Ditok Self-Signed' || '' }}
        with:
          tagName: ${{ needs.tag.outputs.tag }}
          releaseName: Ditok ${{ needs.tag.outputs.tag }}
          releaseBody: Ver as alterações abaixo.
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
