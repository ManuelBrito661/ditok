# Publica uma Release (instaladores + latest.json para o updater) quando é feito
# push de uma tag de versão, ex.: `git tag v0.2.0 && git push origin v0.2.0`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # O motor de transcrição local (sherpa-onnx, estático) entra no instalador do
          # Windows. No macOS fica de fora até o job "local" do ci.yml provar que
          # compila lá (ainda nunca foi compilado nesse sistema).
          - platform: windows-latest
            args: "--features local"
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Uma tag v0.5.3 com a versão 0.5.2 nos ficheiros publicava um instalador com
      # o número errado e o updater nunca o via como novo.
      - name: Confirmar que a versão da tag coincide com os ficheiros
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          tauri_v=$(grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          npm_v=$(grep -m1 '"version"' package.json | cut -d'"' -f4)
          echo "tag=$tag cargo=$cargo_v tauri=$tauri_v package=$npm_v"
          if [ "$tag" != "$cargo_v" ] || [ "$tag" != "$tauri_v" ] || [ "$tag" != "$npm_v" ]; then
            echo "::error::A versão da tag ($tag) não coincide com Cargo.toml ($cargo_v), tauri.conf.json ($tauri_v) ou package.json ($npm_v)."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # O macOS guarda a permissão do microfone associada à identidade de assinatura.
      # Assinar sempre com o mesmo certificado (autoassinado, ver ~/.tauri) faz com
      # que a permissão sobreviva às atualizações.
      - name: Importar certificado de assinatura (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ditok.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Autoassinado = não confiável por omissão; marcamo-lo como confiável para assinar código.
          security find-certificate -c "Ditok Self-Signed" -p "$KEYCHAIN" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && 'Ditok Self-Signed' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Ditok ${{ github.ref_name }}
          releaseBody: Ver as alterações abaixo.
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
