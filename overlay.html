<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/overlay.css" />
    <title>Ditok</title>
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>
  <body>
    <!-- Dica que aparece por cima da pílula quando o rato lhe passa por cima (em repouso),
         ou por baixo quando a pílula está no topo do ecrã (class "tip-below" no body).
         Com um aviso (sem chave, atalho ocupado), diz o que falta em vez do atalho. -->
    <div id="tip" role="tooltip">
      <span id="tip-dictate">Clica ou segura <span id="tip-keys" class="keys"></span> para ditar</span>
      <span id="tip-notice" hidden></span>
    </div>

    <!-- Só as mudanças de estado são anunciadas aos leitores de ecrã. O cronómetro
         (que muda a cada segundo) fica fora desta região, senão seria lido sem parar. -->
    <span id="announce" class="sr-only" role="status" aria-live="polite"></span>

    <!-- data-state: idle | recording | processing | done | copied | failed | nothing-heard
         (vem do backend). class "latched": modo alternar, mostra ✕ e ■. class "hover":
         o rato está por cima. class "slow": a processar há mais de 5 s. class "retry":
         a falha oferece "Tentar de novo". class "command": modo comando (acento violeta;
         "no-selection" sem texto selecionado). class "wide": motivo de falha comprido.
         class "busy": abanão quando o atalho é premido
         a meio do processamento. data-notice: "key" | "shortcut" | "" (aviso persistente
         em repouso: falta a chave, o atalho está ocupado). Clique direito: o menu do Ditok.
         Arrastar a pílula (fora dos botões) move-a; a mascote não se arrasta como imagem. -->

    <div id="pill" data-state="idle">
      <button id="cancel" class="pill-button" type="button" aria-label="Cancelar o ditado">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
      <img id="mascot" alt="" draggable="false" />
      <div id="bars" aria-hidden="true"></div>
      <div id="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <span id="label" aria-hidden="true"></span>
      <span id="retry" aria-hidden="true">Tentar de novo</span>
      <button id="stop" class="pill-button" type="button" aria-label="Parar e colar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
  </body>
</html>
