<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="/src/screen.css" />
    <title>Ditok</title>
    <script type="module" src="/src/screen.ts" defer></script>
  </head>
  <body>
    <!-- A fotografia do ecrã, "congelada" (desenhada por screen.ts) só enquanto escolhes a área: ao
         largar o rato, a área vai para o popup do assistente e esta janela fecha. -->
    <canvas id="shot" aria-hidden="true"></canvas>

    <div id="stage" class="stage" data-mode="idle">
      <!-- A área a ser escolhida. O que fica fora é escurecido (sombra gigante). -->
      <div id="sel" class="sel" hidden>
        <span id="size" class="size" aria-hidden="true"></span>
      </div>

      <div id="hint" class="hint">
        <p class="line">
          <span>Arrasta para escolher a área</span>
          <span class="sep" aria-hidden="true">·</span>
          <span><kbd>Enter</kbd> ou um clique: o ecrã todo</span>
          <span class="sep" aria-hidden="true">·</span>
          <span><kbd>Esc</kbd> cancela</span>
        </p>
        <p class="line">Depois perguntas no popup do assistente</p>
        <p id="status" class="line status" role="status" aria-live="polite" hidden></p>
      </div>

      <button id="close" type="button" class="close" aria-label="Cancelar" title="Cancelar (Esc)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </div>
  </body>
</html>
