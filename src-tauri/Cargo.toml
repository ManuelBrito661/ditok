[package]
name = "ditok"
version = "0.3.1"
description = "Ditado por voz pessoal"
authors = ["Manuel Brito"]
edition = "2024"
default-run = "ditok"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ditok_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Ferramenta de desenvolvimento: só é compilada com `--features cli`, para não
# entrar nos instaladores (o build universal do macOS só junta o binário principal).
[[bin]]
name = "set-key"
required-features = ["cli"]

[features]
cli = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.3"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "rt"] }
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "5.0.1"
bytes = "1.12.1"
async-trait = "0.1.92"
base64 = "0.23.1"
rpassword = "7.5.4"
tauri-plugin-notification = "2.6.0"
time = { version = "0.3.55", features = ["formatting", "macros", "serde"] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
arboard = "3.6.1"
enigo = "0.6.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "multipart", "json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-autostart = "2.7.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
regex = "1.13.1"
symphonia = { version = "0.5.5", features = ["mp3", "aac", "isomp4", "alac"] }
tauri-plugin-dialog = "2.8.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
